name: GalaxyFollows
version: 1.2.1
main: net.bluenetwork.galaxyfollows.GalaxyFollowsPlugin
api-version: '1.21'
description: Reward players for following your BlueGalaxy account
author: Blue Network
website: https://galaxy.gamer.gd

commands:
  galaxyfollows:
    description: GalaxyFollows status and reload
    usage: /galaxyfollows <status|reload>
    aliases: [gfollows]
    permission: galaxyfollows.use

permissions:
  galaxyfollows.use:
    description: Access to /galaxyfollows
    default: op
